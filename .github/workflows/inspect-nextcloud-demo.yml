name: Inspect Nextcloud Demo API

on:
  push:
    paths:
      - '.github/workflows/inspect-nextcloud-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official demo provisioning flow
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/cookies.txt
          curl -fsSL -c /tmp/cookies.txt -b /tmp/cookies.txt https://try.nextcloud.com/ -o /tmp/index.html
          curl -fsSL -c /tmp/cookies.txt -b /tmp/cookies.txt https://try.nextcloud.com/js/main.js -o /tmp/main.js
          echo '--- MAIN.JS ---'
          sed -n '1,320p' /tmp/main.js
          echo '--- ENDPOINT CANDIDATES ---'
          grep -Eo "['\"][^'\"]*(create|demo|access|instance|api|register|provision)[^'\"]*['\"]" /tmp/main.js | head -200 || true
