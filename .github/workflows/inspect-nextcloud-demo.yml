name: Inspect Nextcloud Demo API

on:
  push:
    paths:
      - '.github/workflows/inspect-nextcloud-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current official demo autologin JavaScript
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://demo1.nextcloud.com/apps/demo/js/autologin.js' -o /tmp/autologin.js
          sed -n '1,240p' /tmp/autologin.js
