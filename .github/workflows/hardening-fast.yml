name: Nuvexa Hardening Fast Gate

on:
  push:
    branches:
      - feature/nuvexa-v1-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuvexa-hardening-fast
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Configure Gradle memory
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
          kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC
          org.gradle.workers.max=2
          org.gradle.daemon=false
          EOF

      - name: Compile and run Nuvexa reliability tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon             :app:testGenericDebugUnitTest             --tests 'com.owncloud.android.operations.upload.UploadVerificationPolicyTest'             --tests 'com.owncloud.android.operations.upload.TransferNetworkPolicyTest'             --tests 'com.owncloud.android.operations.download.DownloadVerificationPolicyTest'
