name: Nuvexa Local Server Validation

on:
  push:
    branches:
      - feature/nuvexa-local-phone-server
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Configure Gradle memory
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
          kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC
          org.gradle.workers.max=2
          org.gradle.daemon=false
          EOF

      - name: Unit tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testGenericDebugUnitTest

      - name: Android lint
        shell: bash
        run: ./gradlew --no-daemon :app:lintGenericDebug

      - name: Assemble release APK
        shell: bash
        run: ./gradlew --no-daemon :app:assembleGenericRelease

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK="$(find app/build/outputs/apk/generic/release -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" dist/Nuvexa-Drive-local-server-unsigned.apk
          sha256sum dist/Nuvexa-Drive-local-server-unsigned.apk > dist/Nuvexa-Drive-local-server-unsigned.apk.sha256

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvexa-Drive-local-server-validation
          path: dist/
          if-no-files-found: error
