name: Nuvexa Bootstrap and Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuvexa-bootstrap-main
  cancel-in-progress: false

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Nuvexa
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import stable Nextcloud Android baseline
        if: ${{ !hashFiles('.nuvexa/bootstrap-complete') }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch stable-35.0.0 https://github.com/nextcloud/android.git /tmp/nextcloud-android
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='.nuvexa/' \
            --exclude='branding/' \
            /tmp/nextcloud-android/ ./
          python3 -m pip install --disable-pip-version-check pillow
          python3 .nuvexa/apply_branding.py

      - name: Commit imported Nuvexa source
        if: ${{ !hashFiles('.nuvexa/bootstrap-complete') }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nuvexa Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: import Nextcloud Android 35.0.0 and bootstrap Nuvexa 1.0 [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests and lint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          ./gradlew --no-daemon :app:testGenericDebugUnitTest :app:lintGenericDebug

      - name: Assemble generic release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleGenericRelease

      - name: Prepare aligned unsigned APK and signing verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/tools
          APK="$(find app/build/outputs/apk/generic/release -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          ZIPALIGN="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          APKSIGNER_JAR="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -n1)"
          test -x "$ZIPALIGN"
          test -f "$APKSIGNER_JAR"
          "$ZIPALIGN" -f -p 4 "$APK" dist/Nuvexa-Drive-1.0.0-aligned-unsigned.apk
          cp "$APKSIGNER_JAR" dist/tools/apksigner.jar
          sha256sum dist/Nuvexa-Drive-1.0.0-aligned-unsigned.apk > dist/Nuvexa-Drive-1.0.0-aligned-unsigned.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nuvexa-Drive-1.0.0-build
          path: |
            dist/
            app/build/reports/lint/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 30
