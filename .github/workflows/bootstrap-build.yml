name: Nuvexa Bootstrap and Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuvexa-bootstrap-main
  cancel-in-progress: true

jobs:
  bootstrap-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Nuvexa
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record workflow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .nuvexa/ci
          cat > .nuvexa/ci/latest-run.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_attempt": "$GITHUB_RUN_ATTEMPT",
            "workflow": "$GITHUB_WORKFLOW",
            "source_commit": "$GITHUB_SHA",
            "status": "running",
            "run_url": "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          }
          EOF
          git config user.name "Nuvexa Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .nuvexa/ci/latest-run.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: record Nuvexa run $GITHUB_RUN_ID [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Import stable Nextcloud Android baseline
        id: import
        if: ${{ !hashFiles('.nuvexa/bootstrap-complete') }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch stable-35.0.0 https://github.com/nextcloud/android.git /tmp/nextcloud-android
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='.nuvexa/' \
            --exclude='branding/' \
            /tmp/nextcloud-android/ ./
          python3 -m pip install --disable-pip-version-check pillow
          python3 .nuvexa/apply_branding.py
          echo "did_import=true" >> "$GITHUB_OUTPUT"

      - name: Commit imported Nuvexa source
        if: ${{ steps.import.outputs.did_import == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nuvexa Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: import Nextcloud Android 35.0.0 and bootstrap Nuvexa 1.0 [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show Android runner inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" | tail -20
          ls -1 "$ANDROID_HOME/build-tools" | tail -20

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Configure Gradle memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
          kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC
          org.gradle.workers.max=2
          org.gradle.daemon=false
          org.gradle.caching=true
          EOF

      - name: Unit tests and lint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testGenericDebugUnitTest :app:lintGenericDebug

      - name: Assemble generic release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleGenericRelease

      - name: Assemble managed QA APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleQaDebug
          mkdir -p dist
          QA_APK="$(find app/build/outputs/apk/qa/debug -type f -name '*.apk' | head -n1)"
          test -n "$QA_APK"
          cp "$QA_APK" dist/Nuvexa-Drive-QA-AutoSetup.apk
          sha256sum dist/Nuvexa-Drive-QA-AutoSetup.apk > dist/Nuvexa-Drive-QA-AutoSetup.apk.sha256

      - name: Prepare aligned unsigned APK and verification tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/tools
          APK="$(find app/build/outputs/apk/generic/release -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          ZIPALIGN="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          APKSIGNER_JAR="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -n1)"
          test -x "$ZIPALIGN"
          test -f "$APKSIGNER_JAR"
          "$ZIPALIGN" -f -p 4 "$APK" dist/Nuvexa-Drive-1.0.0-aligned-unsigned.apk
          cp "$APKSIGNER_JAR" dist/tools/apksigner.jar
          sha256sum dist/Nuvexa-Drive-1.0.0-aligned-unsigned.apk > dist/Nuvexa-Drive-1.0.0-aligned-unsigned.apk.sha256

      - name: Sign and verify production APK when signing secrets exist
        id: sign
        shell: bash
        env:
          NUVEXA_KEYSTORE_B64: ${{ secrets.NUVEXA_KEYSTORE_B64 }}
          NUVEXA_KEYSTORE_PASSWORD: ${{ secrets.NUVEXA_KEYSTORE_PASSWORD }}
          NUVEXA_KEY_ALIAS: ${{ secrets.NUVEXA_KEY_ALIAS }}
          NUVEXA_KEY_PASSWORD: ${{ secrets.NUVEXA_KEY_PASSWORD }}
          NUVEXA_EXPECTED_CERT_SHA256: ${{ secrets.NUVEXA_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${NUVEXA_KEYSTORE_B64:-}" ] || [ -z "${NUVEXA_KEYSTORE_PASSWORD:-}" ] || [ -z "${NUVEXA_KEY_ALIAS:-}" ] || [ -z "${NUVEXA_KEY_PASSWORD:-}" ]; then
            echo "Signing secrets are not configured; production release remains blocked."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$NUVEXA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nuvexa-release.jks"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/nuvexa-release.jks" \
            --ks-key-alias "$NUVEXA_KEY_ALIAS" \
            --ks-pass "pass:$NUVEXA_KEYSTORE_PASSWORD" \
            --key-pass "pass:$NUVEXA_KEY_PASSWORD" \
            --out dist/Nuvexa-Drive-1.0.0.apk \
            dist/Nuvexa-Drive-1.0.0-aligned-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs dist/Nuvexa-Drive-1.0.0.apk | tee dist/apksigner-verification.txt
          CERT_SHA256="$("$APKSIGNER" verify --print-certs dist/Nuvexa-Drive-1.0.0.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test -n "$CERT_SHA256"
          if [ -n "${NUVEXA_EXPECTED_CERT_SHA256:-}" ]; then
            EXPECTED="$(printf '%s' "$NUVEXA_EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
            test "$CERT_SHA256" = "$EXPECTED"
          fi
          sha256sum dist/Nuvexa-Drive-1.0.0.apk > dist/Nuvexa-Drive-1.0.0.apk.sha256
          printf '%s\n' "$CERT_SHA256" > dist/signing-certificate-sha256.txt
          rm -f "$RUNNER_TEMP/nuvexa-release.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publish verified signed GitHub release
        if: ${{ steps.sign.outputs.signed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Nuvexa Drive 1.0.0

          First Nuvexa Drive release candidate based on the stable Nextcloud Android 35.0.0 baseline.

          This release asset is produced only after unit tests, Android lint, release assembly, APK signing and signature verification complete successfully.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Nuvexa-Drive-1.0.0.apk dist/Nuvexa-Drive-1.0.0.apk.sha256 dist/signing-certificate-sha256.txt --clobber
          else
            gh release create "$TAG" dist/Nuvexa-Drive-1.0.0.apk dist/Nuvexa-Drive-1.0.0.apk.sha256 dist/signing-certificate-sha256.txt --target "$GITHUB_SHA" --title "Nuvexa Drive 1.0.0" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nuvexa-Drive-1.0.0-build
          path: |
            dist/
            app/build/reports/lint/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 30
