name: Bootstrap Nuvexa Drive

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  import-base:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nuvexa repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect bootstrap state
        id: state
        shell: bash
        run: |
          if [ -f .nuvexa/bootstrap-complete ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import official Nextcloud Android 35.0.0 source baseline
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch stable-35.0.0 https://github.com/nextcloud/android.git /tmp/nextcloud-android
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows' \
            /tmp/nextcloud-android/ ./
          mkdir -p .nuvexa
          cat > .nuvexa/bootstrap-complete <<'EOF'
          Nuvexa Drive independent source import
          Upstream: https://github.com/nextcloud/android
          Upstream tag: stable-35.0.0
          Imported as source baseline, not as a GitHub fork.
          EOF

      - name: Add Nuvexa baseline documentation
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          cat > NUVEXA_BASELINE.md <<'EOF'
          # Nuvexa Drive — Source Baseline

          This repository is an independent source import based on the official Nextcloud Android application.

          - Upstream project: Nextcloud Android
          - Imported baseline: stable-35.0.0
          - Nuvexa initial product version: 1.0.0
          - Import strategy: independent Git history; not created through GitHub Fork
          - License/copyright/SPDX obligations from upstream and third-party components must be preserved.

          Nuvexa-specific engineering follows a non-regression policy: understand, reproduce, apply the smallest correct fix, validate, then continue.
          EOF

      - name: Commit imported baseline
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nuvexa Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: import Nextcloud Android 35.0.0 baseline"
          git push origin main
